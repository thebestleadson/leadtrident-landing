<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Book a free roof inspection</title>
<meta name="robots" content="noindex">
<!--
  Public booking page for the Marketing Area.

  Why this is a static file and not part of the marketing-public edge function:
  Supabase's function gateway rewrites any HTML response to Content-Type
  text/plain and attaches `Content-Security-Policy: default-src 'none'; sandbox`,
  so a page served from a function renders as raw source. JSON passes through
  untouched, so the function is a pure API and this file is the page.

  It carries no secrets. The link token in ?t= is the only input; the API
  resolves the tenant and calendar from it server-side.
-->
<style>
:root{--brand:#1D4ED8;--bg:#F5F7FA;--surface:#fff;--border:#E8ECF0;--text:#111827;--muted:#6B7280}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:560px;margin:0 auto;padding:28px 16px 64px}
h1{font-size:25px;margin:0 0 6px;line-height:1.25}
.tag{color:var(--muted);font-size:15px;line-height:1.55;margin:0 0 22px}
.about{color:var(--muted);font-size:13px;line-height:1.6;margin:0}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px}
.card h2{font-size:15px;margin:0 0 12px}
label{display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:10px 0 5px}
input,textarea{width:100%;padding:11px 12px;border-radius:9px;border:1px solid var(--border);background:#F9FAFB;font-size:16px;font-family:inherit;color:var(--text)}
textarea{min-height:74px;resize:vertical}
.row{display:flex;gap:10px}.row>*{flex:1}
button{width:100%;padding:13px;border:0;border-radius:10px;background:var(--brand);color:#fff;font-size:15px;font-weight:700;cursor:pointer;margin-top:14px}
button:disabled{opacity:.5;cursor:default}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.result{margin-top:14px;font-size:14px;line-height:1.6}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{background:rgba(245,158,11,.12);color:#B45309;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:700}
.note{color:var(--muted);font-size:12px;margin-top:10px;line-height:1.55;display:block}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:7px;margin-top:10px}
.slot{padding:10px 6px;border:1px solid var(--border);border-radius:8px;background:var(--surface);font-size:14px;cursor:pointer;text-align:center}
.slot.sel{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:700}
.ok{text-align:center;padding:38px 14px}
.tel{display:inline-block;margin-top:10px;color:var(--brand);font-weight:600;text-decoration:none}
.err{color:#DC2626;font-size:13px;margin-top:10px}
.gone{max-width:420px;margin:14vh auto;text-align:center;padding:0 20px}
</style>
</head>
<body>
<div class="wrap" id="app" hidden>
  <h1 id="biz">Free Roof Inspection</h1>
  <p class="tag" id="tagline">Find out if a storm hit your address &mdash; then book a free inspection.</p>

  <div class="card">
    <h2>Was your area hit by a storm?</h2>
    <label for="address">Street address</label>
    <input id="address" autocomplete="street-address" placeholder="123 Main St">
    <div class="row">
      <div><label for="city">City</label><input id="city" autocomplete="address-level2"></div>
      <div><label for="state">State</label><input id="state" autocomplete="address-level1" maxlength="2" placeholder="TX"></div>
      <div><label for="zipcode">ZIP</label><input id="zipcode" autocomplete="postal-code" inputmode="numeric"></div>
    </div>
    <button id="checkBtn" type="button">Check my address</button>
    <div class="result" id="stormResult"></div>
  </div>

  <div class="card">
    <h2>Book a free inspection</h2>
    <label for="date">Pick a day</label>
    <input type="date" id="date">
    <div class="slots" id="slots"></div>
    <div class="row">
      <div><label for="first_name">First name</label><input id="first_name" autocomplete="given-name"></div>
      <div><label for="last_name">Last name</label><input id="last_name" autocomplete="family-name"></div>
    </div>
    <div class="row">
      <div><label for="phone">Phone</label><input id="phone" type="tel" autocomplete="tel"></div>
      <div><label for="email">Email (optional)</label><input id="email" type="email" autocomplete="email"></div>
    </div>
    <label for="message">Anything we should know? (optional)</label>
    <textarea id="message"></textarea>
    <div class="hp" aria-hidden="true"><label for="company">Company</label><input id="company" tabindex="-1" autocomplete="off"></div>
    <button id="bookBtn" type="button" disabled>Pick a day and time</button>
    <div class="err" id="bookErr"></div>
  </div>

  <div class="card" id="aboutCard" hidden><p class="about" id="about"></p><a class="tel" id="phoneLink" href="#"></a></div>
</div>

<div class="gone" id="gone" hidden>
  <h1>This link isn't available</h1>
  <p class="tag">It may have expired or been turned off. If someone shared it with you, ask them for a current one.</p>
</div>

<script>
var API = 'https://hihnfoozljwgkhqzeujh.supabase.co/functions/v1/marketing-public';
var TOKEN = new URLSearchParams(location.search).get('t') || '';
var stormDates = [], picked = null, geo = { lon: null, lat: null }, site = {};
function $(id){ return document.getElementById(id); }
function fmt(t){ var p=t.split(':'),h=+p[0],m=p[1],ap=h>=12?'PM':'AM',h12=h%12===0?12:h%12; return h12+':'+m+' '+ap; }
function fmtDay(d){ var p=d.split('-'); return p[1]+'/'+p[2]+'/'+p[0]; }

(function init(){
  if(!TOKEN){ $('gone').hidden=false; return; }
  fetch(API+'/api/site?token='+encodeURIComponent(TOKEN))
    .then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(j){
      site = j;
      if(j.business_name) $('biz').textContent = j.business_name;
      if(j.tagline) $('tagline').textContent = j.tagline;
      if(j.about){ $('about').textContent = j.about; $('aboutCard').hidden=false; }
      if(j.phone){ var a=$('phoneLink'); a.textContent=j.phone; a.href='tel:'+j.phone; $('aboutCard').hidden=false; }
      $('app').hidden = false;
      var d = new Date(); d.setDate(d.getDate()+1);
      $('date').value = d.toISOString().slice(0,10);
      $('date').min = new Date().toISOString().slice(0,10);
      loadSlots();
    })
    .catch(function(){ $('gone').hidden=false; });
})();

$('checkBtn').onclick = function(){
  var btn=$('checkBtn'), out=$('stormResult');
  btn.disabled=true; btn.textContent='Checking…'; out.textContent='';
  fetch(API+'/api/storm-check',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({token:TOKEN,address:$('address').value,city:$('city').value,state:$('state').value,zipcode:$('zipcode').value})})
   .then(function(r){ return r.json().then(function(j){ return {s:r.status,j:j}; }); })
   .then(function(res){
     var j=res.j;
     if(res.s===429){ out.innerHTML='<span class="note">Too many checks from this connection. Please try again in a little while.</span>'; }
     else if(j.status==='ok' && j.dates && j.dates.length){
       stormDates = j.dates.map(function(d){ return d.date; });
       geo={lon:j.lon,lat:j.lat};
       out.innerHTML='<strong>Yes &mdash; '+j.dates.length+' storm'+(j.dates.length>1?'s have':' has')+' hit your area.</strong>'+
         '<div class="chips">'+j.dates.slice(0,8).map(function(d){ return '<span class="chip">'+fmtDay(d.date)+'</span>'; }).join('')+'</div>'+
         '<span class="note">These are storm days recorded in your area (about a 7&nbsp;mile grid). An inspection is what confirms whether your roof itself was damaged.</span>';
     }
     else if(j.status==='ok'){
       out.innerHTML='<strong>No storm days on record for your area.</strong><span class="note">Still worth an inspection if you are seeing granules in the gutters, ceiling stains, or missing shingles.</span>';
     }
     else if(j.status==='address_not_found'){
       out.innerHTML='<span class="note">We could not find that address. Check the spelling, or just book below and we will sort it out.</span>';
     }
     else { out.innerHTML='<span class="note">Storm history is unavailable right now. You can still book below.</span>'; }
   })
   .catch(function(){ out.innerHTML='<span class="note">Something went wrong. You can still book below.</span>'; })
   .then(function(){ btn.disabled=false; btn.textContent='Check my address'; });
};

function syncBook(){ var b=$('bookBtn'); b.disabled=!picked; b.textContent = picked ? 'Book '+fmt(picked) : 'Pick a day and time'; }

function loadSlots(){
  var box=$('slots'); box.innerHTML='<span class="note">Loading times…</span>'; picked=null; syncBook();
  fetch(API+'/api/slots?token='+encodeURIComponent(TOKEN)+'&date='+encodeURIComponent($('date').value))
   .then(function(r){ return r.json(); })
   .then(function(j){
     if(!j.slots || !j.slots.length){ box.innerHTML='<span class="note">No times left that day &mdash; try another.</span>'; return; }
     box.innerHTML='';
     j.slots.forEach(function(t){
       var b=document.createElement('div'); b.className='slot'; b.textContent=fmt(t);
       b.onclick=function(){ picked=t; Array.prototype.forEach.call(box.children,function(c){c.classList.remove('sel');}); b.classList.add('sel'); syncBook(); };
       box.appendChild(b);
     });
   })
   .catch(function(){ box.innerHTML='<span class="note">Could not load times.</span>'; });
}
$('date').onchange = loadSlots;

$('bookBtn').onclick = function(){
  var b=$('bookBtn'), err=$('bookErr'); err.textContent='';
  if(!$('first_name').value.trim() || !$('phone').value.trim()){ err.textContent='Please add your name and phone so we can confirm.'; return; }
  b.disabled=true; b.textContent='Booking…';
  var when = $('date').value, at = picked;
  fetch(API+'/api/book',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
    token:TOKEN, date:when, time:at,
    first_name:$('first_name').value, last_name:$('last_name').value,
    phone:$('phone').value, email:$('email').value,
    address:$('address').value, city:$('city').value, state:$('state').value, zipcode:$('zipcode').value,
    message:$('message').value, company:$('company').value,
    storm_dates:stormDates, lon:geo.lon, lat:geo.lat })})
   .then(function(r){ return r.json(); })
   .then(function(j){
     if(j.ok){
       var tel = site.phone ? '<a class="tel" href="tel:'+site.phone+'">'+site.phone+'</a>' : '';
       document.getElementById('app').innerHTML =
         '<div class="card ok"><h1>You are booked.</h1>'+
         '<p class="tag">'+fmtDay(when)+' at '+fmt(at)+'</p>'+
         '<p class="about">We will call to confirm. If you need to change it, just give us a ring.</p>'+tel+'</div>';
       window.scrollTo(0,0);
       return;
     }
     if(j.error==='slot_taken'){ err.textContent='Someone just took that time. Please pick another.'; loadSlots(); }
     else if(j.error==='rate_limited'){ err.textContent='Too many attempts from this connection. Please try again later.'; }
     else { err.textContent='We could not book that. Please try again.'; }
     b.disabled=false; syncBook();
   })
   .catch(function(){ err.textContent='We could not book that. Please try again.'; b.disabled=false; syncBook(); });
};
</script>
</body>
</html>
