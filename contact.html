<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contact — LeadTrident</title>
<meta name="description" content="Get in touch with LeadTrident. We respond within 24 hours." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #000013;
    --bg-elev: #0A0A1A;
    --card: #1A1A28;
    --brand: #1F619D;
    --brand-hover: #2B7BBF;
    --text: #FFFFFF;
    --muted: #5C5C68;
    --border: rgba(255, 255, 255, 0.06);
    --cyan: #1F619D;
    --grad: linear-gradient(135deg, #1F619D 0%, #19719C 100%);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    font-weight: 400;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--cyan); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
  .navbar {
    position: sticky; top: 0; z-index: 100;
    background: rgba(10, 10, 10, 0.72);
    backdrop-filter: saturate(180%) blur(14px);
    -webkit-backdrop-filter: saturate(180%) blur(14px);
    border-bottom: 1px solid var(--border);
  }
  .nav-inner {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 24px; max-width: 1200px; margin: 0 auto;
  }
  .brand { display: inline-flex; align-items: center; gap: 12px; font-weight: 800; font-size: 18px; letter-spacing: 0.02em; color: #fff; }
  .brand-mark { height: 52px; width: auto; display: block; }
  .brand-text .lead { color: #ffffff; }
  .brand-text .trident { color: var(--cyan); }
  .contact-page { padding: 80px 0 100px; }
  .contact-head { text-align: center; margin-bottom: 48px; }
  .contact-head .eyebrow {
    display: inline-block;
    color: var(--cyan);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    margin-bottom: 14px;
  }
  .contact-head h1 {
    font-size: clamp(32px, 4.5vw, 48px);
    font-weight: 700;
    letter-spacing: -0.025em;
    line-height: 1.15;
    margin-bottom: 14px;
  }
  .contact-head p {
    color: var(--muted);
    font-size: 17px;
    max-width: 580px;
    margin: 0 auto;
  }
  .contact-form-wrap {
    max-width: 720px;
    margin: 0 auto;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 28px;
    position: relative;
  }
  .contact-form-wrap::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 18px;
    padding: 1.5px;
    background: var(--grad);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
            mask-composite: exclude;
    pointer-events: none;
  }
  .contact-form-wrap iframe {
    width: 100%;
    min-height: 720px;
    border: none;
    border-radius: 10px;
    background: #fff;
    display: block;
  }
  .contact-fallback {
    margin-top: 24px;
    text-align: center;
    color: var(--muted);
    font-size: 14.5px;
  }
  .contact-fallback a { color: var(--cyan); }
  footer {
    border-top: 1px solid var(--border);
    padding: 36px 0;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
  }
  footer a { color: var(--muted); margin: 0 12px; }
  footer a:hover { color: var(--cyan); text-decoration: none; }
  @media (max-width: 720px) {
    .contact-form-wrap { padding: 18px; }
    .contact-form-wrap iframe { min-height: 820px; }
  }
</style>
</head>
<body>

<nav class="navbar">
  <div class="nav-inner">
    <a href="/" class="brand" aria-label="LeadTrident home">
      <img src="assets/Lead_Trident_Symbol_Med.png" alt="Lead Trident" class="brand-mark" />
      <span class="brand-text"><span class="lead">LEAD</span><span class="trident">TRIDENT</span></span>
    </a>
  </div>
</nav>

<main class="contact-page">
  <div class="container">
    <div class="contact-head">
      <span class="eyebrow">Contact</span>
      <h1>Get in touch</h1>
      <p>Tell us a bit about your team and how you'd like to use LeadTrident. We respond within 24 hours.</p>
    </div>

    <div class="contact-form-wrap">
      <iframe
        src="https://forms.zohopublic.com/supportleadt1/form/LeadTridentContact/formperma/hpRTurmZO6SbHymTYPuBACXjtvrmpI6KZFhYmUkeRT0"
        title="LeadTrident Contact Form"
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade">
      </iframe>
    </div>

    <p class="contact-fallback">
      Prefer email? Reach us directly at <a href="mailto:support@leadtrident.com">support@leadtrident.com</a>.
    </p>
  </div>
</main>

<footer>
  <div class="container">
    <a href="/">Home</a>
    <a href="/terms.html">Terms</a>
    <a href="/privacy.html">Privacy</a>
    <a href="/contact.html">Contact</a>
    <div style="margin-top: 14px;">&copy; 2026 Lead Trident</div>
  </div>
</footer>

</body>
</html>
